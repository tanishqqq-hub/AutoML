project:
  name: automl_studio
  version: "1.0"

paths:
  data_dir: data/
  raw_data: data/raw/dataset.csv
  processed_data_dir: data/processed/
  models_dir: artifacts/models/
  metrics_dir: artifacts/metrics/
  experiments_dir: artifacts/experiments/
  logs_dir: logs/

data:
  dataset_path: data/raw/dataset.csv
  target_column: Survived
  test_size: 0.2
  random_seed: 42
  task_type: auto
  classification_unique_threshold: 20

validation:
  null_threshold: 0.5
  min_rows: 100

preprocessing:
  scaling: standard
  encoding: onehot
  feature_selection: false
  variance_threshold: 0.01   
  handle_imbalance: false

models:
  n_trials: 5
  enabled:
    - random_forest
    - xgboost
    - logistic_regression
    - gradient_boosting
    - lightgbm

  hyperparameters:
    logistic_regression:
      C: [0.01, 10.0]
      max_iter: [100, 500]

    random_forest:
      n_estimators: [50, 300]
      max_depth: [3, 10]
      min_samples_split: [2, 10]

    gradient_boosting:
      n_estimators: [50, 300]
      learning_rate: [0.01, 0.3]
      max_depth: [3, 10]

    xgboost:
      n_estimators: [50, 300]
      learning_rate: [0.01, 0.3]
      max_depth: [3, 10]

    lightgbm:
      n_estimators: [50, 300]
      learning_rate: [0.01, 0.3]
      max_depth: [3, 10] 

evaluation:
  primary_metric: roc_auc
  secondary_metrics:
    - accuracy
    - precision
    - recall
    - f1

mlflow:
  tracking_uri: mlruns
  experiment_name: automl_experiments

logging:
  level: INFO
  file: logs/pipeline.log